<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hope Connected | Página de Perfil</title>

    <!-- Link do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Link dos Ícones do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Link da fonte Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Link do css global -->
    <link rel="stylesheet" href="../../css/global/global.css">
    <link rel="stylesheet" href="../../css/global/layout.css">

    <!-- Link do css da page -->
     <link rel="stylesheet" href="../usuario-solicitante/usuario-solicitante.css">

</head>
    <body>
        <div class="d-flex flex-column flex-sm-row min-vh-100">

            <aside class="hc-sidebar">
                <nav class="d-flex flex-sm-column justify-content-around justify-content-sm-start align-items-center gap-sm-2 h-100 py-2 py-sm-4">
                    <a href="perfil.html" class="hc-side-item"><i class="bi bi-person"></i><span>Perfil</span></a>
                    <a href="#" class="hc-side-item"><i class="bi bi-house"></i><span>Início</span></a>
                    <a href="#" class="hc-side-item"><i class="bi bi-info-square"></i><span>Sobre</span></a>
                    <a href="#" class="hc-side-item"><i class="bi bi-question-square"></i><span>Suporte</span></a>

                    <a href="../login/login.html" class="hc-side-item mt-sm-auto"><i class="bi bi-box-arrow-left"></i><span>Sair</span></a>
                </nav>
            </aside>
            
            <main class="flex-grow-1 p-3 p-md-4 hc-conteudo">
                <ul class="nav nav-pills hc-abas mb-4" id="abas" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="aba-realizar-solicitacao" data-bs-toggle="pill"
                        data-bs-target="#painel-realizar-solicitacao" type="button" role="tab"
                        aria-controls="painel-realizar-solicitacao" aria-selected="true">Realizar Solicitação</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="aba-solicitacoes" data-bs-toggle="pill"
                        data-bs-target="#painel-solicitacoes" type="button" role="tab"
                        aria-controls="painel-solicitacoes" aria-selected="false">Visualizar Solicitações</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active">
                        <section class="card hc-card hc-sombra p-3 p-md-4 mb-4">
                            <ul class="list-unstyled d-grid gap-3 mb-0" id="lista-empresas"></ul>

                            <p class="text-center text-body-secondary py-4 mb-0" id="vazio-impressoras">
                                Nenhuma empresa cadastrada ainda.
                            </p>
                        </section>
                    </div>
                    
                <div class="tab-pane fade" id="painel-solicitacoes" role="tabpanel"
                    aria-labelledby="aba-solicitacoes">
                    
                    <section class="card hc-card hc-sombra p-3 p-md-4">
                        <h2 class="hc-subtitulo">Solicitações Recentes</h2>
                        <p class="mb-3">Últimas solicitações realizadas:</p>
                        
                        <div class="hc-grid-solic hc-cabecalho d-none d-md-grid" aria-hidden="true">
                            <span>Nº</span>
                            <span>Produto</span>
                            <span>Mandante</span>
                            <span>Tipo</span>
                            <span>Status</span>
                            <span>Data de Emissão</span>
                        </div>
                        
                        <ul class="list-unstyled d-grid gap-3 mb-0" id="lista-solicitacoes"></ul>
                        
                        <p class="text-center text-body-secondary py-4 mb-0" id="vazio-solicitacoes">
                            Nenhuma solicitação recebida até o momento.
                        </p>
                    </section>
                </div>
            </main>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
